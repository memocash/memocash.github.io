<link rel="stylesheet" href="{{ '/example/comments/comments.css' | relative_url }}"/>
<script src="{{ '/lib/jmemo.min.js' | relative_url }}"></script>
<script src="{{ '/example/comments/js/init.js' | relative_url }}"></script>
<script src="{{ '/example/comments/js/modal.js' | relative_url }}"></script>
<script src="{{ '/example/comments/js/template.js' | relative_url }}"></script>
<script src="{{ '/example/comments/js/user.js' | relative_url }}"></script>
<script src="{{ '/example/comments/js/api.js' | relative_url }}"></script>

<script src="{{ '/example/comments/js/tx.js' | relative_url }}"></script>

<div id="site-wrapper">
    <div id="inner-site-wrapper">
        <h1 class="page-header">Comments Example</h1>

        <p><a id="user-info">Connect Account</a></p>

        <form id="comment-form">
            <div class="form-group row">
                <label for="comment" class="col-form-label col-sm-3">Comment</label>
                <div class="col-sm-9">
                    <textarea class="form-control" name="comment" id="comment"></textarea>
                </div>
            </div>
            <div class="form-group row">
                <div class="col-sm-9 col-sm-offset-3">
                    <input class="btn btn-sm btn-primary" type="submit" value="Post"/>
                </div>
            </div>
        </form>
        <br>
        <div id="comments"></div>
    </div>
</div>
<div id="site-wrapper-cover"></div>
<div id="site-modal-wrapper"></div>

<script>
    ExampleComments.User.InitWallet($("#mnemonic"));
    ExampleComments.User.InitInfo();
    ExampleComments.Posts.SetComments($("#comments"), ExampleComments.Const.ModAddresses);
    ExampleComments.Posts.Load();
    ExampleComments.Posts.Form($("#comment-form"));
</script>
